[www]
user = app
group = app
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Mitigation for CVE-2026-109618 / CVE-2026-109619: cannot be re-enabled per directory
php_admin_flag[session.upload_progress.enabled] = off
